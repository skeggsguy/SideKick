<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 326" width="760" height="326" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Approve from your phone: a scheduled run searches and reads on its own, pauses when it wants to send an email, pushes the approval to your phone, and sends only after you approve; the approval is logged">
<rect width="760" height="326" fill="#ffffff"/>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6670"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8730f"/></marker>
</defs>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1b2228">Approve from your phone</text>
<text x="20" y="50" font-size="12" fill="#5a6670">A background run never sends, books or deletes on its own. It pauses, asks, and carries on when you answer.</text>

<rect x="10" y="64" width="740" height="104" rx="8" fill="#f2f8f8"/>
<text x="22" y="84" font-size="13" font-weight="700" fill="#0f6e72">ON THE MAC</text>
<g font-size="11.5" fill="#1b2228" text-anchor="middle">
<rect x="20" y="96" width="130" height="62" rx="6" fill="#ffffff" stroke="#c4ccd2"/>
<text x="85" y="118" font-weight="600">7:00, Saturday</text><text x="85" y="134">the weekly property</text><text x="85" y="148">watch starts</text>
<rect x="165" y="96" width="130" height="62" rx="6" fill="#ffffff" stroke="#c4ccd2"/>
<text x="230" y="118" font-weight="600">Searches, reads</text><text x="230" y="134">read-only tools</text><text x="230" y="148">run at once</text>
<rect x="310" y="96" width="140" height="62" rx="6" fill="#b8730f"/>
<text x="380" y="118" font-weight="700" fill="#ffffff">Wants to send</text><text x="380" y="134" fill="#fbf0de">a reply to a listing:</text><text x="380" y="148" fill="#fbf0de">outward, so it asks</text>
<rect x="465" y="96" width="130" height="62" rx="6" fill="#ffffff" stroke="#c4ccd2" stroke-dasharray="4 3"/>
<text x="530" y="118" font-weight="600">Paused</text><text x="530" y="134">up to 6 hours;</text><text x="530" y="148">no answer means no</text>
<rect x="610" y="96" width="130" height="62" rx="6" fill="#0f6e72"/>
<text x="675" y="118" font-weight="700" fill="#ffffff">Sends it</text><text x="675" y="134" fill="#e2f0f0">and the audit log</text><text x="675" y="148" fill="#e2f0f0">records who said yes</text>
</g>
<g stroke="#5a6670" stroke-width="1.5" marker-end="url(#b)">
<line x1="150" y1="127" x2="163" y2="127"/><line x1="295" y1="127" x2="308" y2="127"/><line x1="450" y1="127" x2="463" y2="127"/>
</g>

<rect x="10" y="184" width="740" height="88" rx="8" fill="#fbf4e8"/>
<text x="22" y="204" font-size="13" font-weight="700" fill="#b8730f">ON YOUR PHONE</text>
<g font-size="11.5" fill="#1b2228" text-anchor="middle">
<rect x="310" y="212" width="285" height="50" rx="6" fill="#ffffff" stroke="#c4ccd2"/>
<text x="452" y="232" font-weight="600">A push notification; tap it to see the draft</text>
<text x="452" y="250">Approve or Deny, right there in the app</text>
</g>
<g stroke="#b8730f" stroke-width="1.5" fill="none" marker-end="url(#w)">
<line x1="380" y1="158" x2="380" y2="210"/>
<path d="M595,237 H675 V160"/>
</g>
<text x="20" y="294" font-size="11.5" fill="#5a6670">Local edits you trust can be allowlisted; sends and deletes always ask.</text>
<text x="20" y="311" font-size="11.5" fill="#5a6670">An email or a web page can't approve anything: what it says is data, never an instruction.</text>
</svg>
