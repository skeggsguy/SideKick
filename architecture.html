<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Agent Harness — Architecture</title>
<style>
  :root{
    --bg:#f6f7f9; --ink:#1f2733; --muted:#6b7685; --faint:#9aa4b2;
    --card:#ffffff; --line:#e3e7ee;
    --chat:#2f6fed; --cron:#e0922f; --watch:#8b5cf6;
    --push:#18a558; --mem:#0fb5ba; --models:#e06c5a; --tools:#5b6b8c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:
     radial-gradient(1200px 700px at 70% -10%, #ffffff 0%, #f6f7f9 55%, #eef1f5 100%);
     color:var(--ink);
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1480px;margin:0 auto;padding:26px 22px 40px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;
     flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  header.top h1{font-size:20px;font-weight:650;letter-spacing:.2px;margin:0}
  header.top h1 span{color:var(--chat)}
  header.top p{margin:0;color:var(--muted);font-size:13px;max-width:560px;text-align:right}
  .frame{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:18px;
     box-shadow:0 12px 40px -22px rgba(31,39,51,.35);overflow:hidden}
  svg{display:block;width:100%;height:auto}

  /* SVG text styling */
  .t-title{font-size:15px;font-weight:650;fill:var(--ink)}
  .t-sub{font-size:11.5px;fill:var(--muted)}
  .t-path{font-size:10.5px;fill:var(--faint);
     font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .t-zone{font-size:11px;font-weight:650;letter-spacing:1.4px;fill:var(--faint)}
  .t-bus{font-size:13px;font-weight:700;letter-spacing:3px;fill:#3556a8}
  .t-chip{font-size:11px;font-weight:600;fill:var(--ink)}
  .t-tag{font-size:9.5px;font-weight:600;letter-spacing:.4px}
  .t-lane{font-size:10.5px;font-weight:600;letter-spacing:1.2px;fill:#7d93c9}

  .card{filter:url(#softshadow)}
  .surface{fill:var(--card);stroke:var(--line);stroke-width:1.2}

  /* animated dashed flow on connectors */
  .flow{fill:none;stroke-width:1.6;stroke-linecap:round;
     stroke-dasharray:2 8;animation:dash 1.4s linear infinite;opacity:.55}
  @keyframes dash{to{stroke-dashoffset:-40}}
  .flow.chat{stroke:var(--chat)} .flow.cron{stroke:var(--cron)}
  .flow.watch{stroke:var(--watch)} .flow.push{stroke:var(--push);animation-duration:2.2s}
  .flow.mem{stroke:var(--mem);stroke-dasharray:1 7;animation-duration:2.6s}
  .flow.dep{stroke:var(--tools);opacity:.4}

  .lane{fill:none;stroke:#cdd9f5;stroke-width:16;stroke-linecap:round;
     stroke-linejoin:round;opacity:.55}

  .pulse{transform-box:fill-box;transform-origin:center;
     animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}

  .legend text{font-size:11px;fill:var(--muted)}
  .badge{font-size:9px;font-weight:700;letter-spacing:.4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Personal Agent Harness · <span>agentd</span> — event-driven architecture</h1>
    <p>One long-lived asyncio daemon. You typing, a cron firing, an email arriving —
       every invocation is just an <em>event</em> on the same path.</p>
  </header>

  <div class="frame">
  <svg viewBox="0 0 1480 980" xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink" role="img"
       aria-label="Animated architecture diagram of the agentd personal agent harness">
    <defs>
      <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1f2733" flood-opacity="0.10"/>
      </filter>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="busgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eef3fd"/><stop offset="1" stop-color="#e2eafb"/>
      </linearGradient>
      <linearGradient id="agentgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#f4f8ff"/>
      </linearGradient>

      <!-- ===== journey paths (sources converge on the bus, share one downstream lane) ===== -->
      <path id="jCLI"   d="M252,196 L340,196 L406,462 L470,462 L660,462 L720,462 L824,462 L824,572 L824,706"/>
      <path id="jWeb"   d="M252,316 L340,316 L406,462 L470,462 L660,462 L720,462 L824,462 L824,572 L824,706"/>
      <path id="jCron"  d="M252,606 L340,606 L406,462 L470,462 L660,462 L720,462 L824,462 L824,572 L824,706"/>
      <path id="jWatch" d="M252,726 L340,726 L406,462 L470,462 L660,462 L720,462 L824,462 L824,572 L824,706"/>
      <!-- dependency + return paths -->
      <path id="pModels" d="M1106,414 C1150,360 1170,300 1228,256"/>
      <path id="pTools"  d="M1106,498 L1190,486"/>
      <path id="pPush"   d="M860,560 C760,210 470,150 256,300"/>
      <path id="pMem"    d="M992,690 L992,576"/>
    </defs>

    <!-- ============ agentd boundary ============ -->
    <rect x="300" y="96" width="822" height="806" rx="20"
          fill="url(#agentgrad)" stroke="#cdd6e6" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text class="t-zone" x="320" y="126">AGENTD · ONE ASYNCIO PROCESS</text>

    <!-- shared lane highlight under the spine -->
    <path class="lane" d="M406,462 L470,462 L660,462 L720,462 L824,462 L824,572 L824,706"/>
    <text class="t-lane" x="470" y="446">EVERY EVENT → THE SAME PATH</text>

    <!-- zone labels -->
    <text class="t-zone" x="44" y="126">EVENT SOURCES</text>
    <text class="t-zone" x="1190" y="126">EXTERNAL DEPENDENCIES</text>

    <!-- ================= connector base lines (animated dashes) ================= -->
    <path class="flow chat"  d="M252,196 L340,196"/>
    <path class="flow chat"  d="M252,316 L340,316"/>
    <path class="flow cron"  d="M252,606 L340,606"/>
    <path class="flow watch" d="M252,726 L340,726"/>
    <path class="flow chat"  d="M406,462 L470,462 L660,462 L720,462 L824,462 L824,572 L824,706"/>
    <path class="flow dep"   d="M1106,414 C1150,360 1170,300 1228,256"/>
    <path class="flow dep"   d="M1106,498 L1190,486"/>
    <path class="flow push"  d="M860,560 C760,210 470,150 256,300"/>
    <path class="flow mem"   d="M992,690 L992,576"/>

    <!-- ================= SOURCE CARDS ================= -->
    <g class="card">
      <rect class="surface" x="44" y="160" width="208" height="74" rx="13"/>
      <rect x="44" y="160" width="5" height="74" rx="2.5" fill="var(--chat)"/>
      <text class="t-title" x="66" y="190">CLI REPL</text>
      <text class="t-sub"   x="66" y="208">interactive chat · rich + prompt_toolkit</text>
      <text class="t-path"  x="66" y="225">interfaces/cli.py</text>
    </g>
    <g class="card">
      <rect class="surface" x="44" y="280" width="208" height="74" rx="13"/>
      <rect x="44" y="280" width="5" height="74" rx="2.5" fill="var(--chat)"/>
      <text class="t-title" x="66" y="310">Web UI · iPad PWA</text>
      <text class="t-sub"   x="66" y="328">Tailscale · SSE stream · Web Push</text>
      <text class="t-path"  x="66" y="345">gateway/app.py</text>
    </g>
    <g class="card">
      <rect class="surface" x="44" y="570" width="208" height="74" rx="13"/>
      <rect x="44" y="570" width="5" height="74" rx="2.5" fill="var(--cron)"/>
      <text class="t-title" x="66" y="600">Scheduler · cron</text>
      <text class="t-sub"   x="66" y="618">tick loop · local-time specs</text>
      <text class="t-path"  x="66" y="635">scheduler/scheduler.py</text>
      <rect x="196" y="576" width="50" height="15" rx="7.5" fill="#fdf1e1"/>
      <text class="t-tag badge" x="203" y="587" fill="#b9701e">in agentd</text>
    </g>
    <g class="card">
      <rect class="surface" x="44" y="690" width="208" height="74" rx="13"/>
      <rect x="44" y="690" width="5" height="74" rx="2.5" fill="var(--watch)"/>
      <text class="t-title" x="66" y="720">Watchers · Gmail</text>
      <text class="t-sub"   x="66" y="738">historyId poll 120s · local triage</text>
      <text class="t-path"  x="66" y="755">scheduler/watchers/gmail.py</text>
      <rect x="196" y="696" width="50" height="15" rx="7.5" fill="#f3edfd"/>
      <text class="t-tag badge" x="203" y="707" fill="#6d49c4">in agentd</text>
    </g>

    <!-- ================= EVENT BUS ================= -->
    <g class="card">
      <rect x="340" y="150" width="66" height="640" rx="16" fill="url(#busgrad)"
            stroke="#c2d0ee" stroke-width="1.4"/>
      <rect class="pulse" x="340" y="150" width="66" height="640" rx="16"
            fill="none" stroke="#9db6ec" stroke-width="1.4"/>
      <text class="t-bus" x="373" y="470" text-anchor="middle"
            transform="rotate(-90 373 470)">EVENT&#160;BUS</text>
      <text class="t-path" x="373" y="772" text-anchor="middle"
            transform="rotate(-90 373 540)" opacity="0">core/events.py</text>
    </g>
    <text class="t-path" x="346" y="806">core/events.py</text>

    <!-- ================= ORCHESTRATOR ================= -->
    <g class="card">
      <rect class="surface" x="470" y="404" width="190" height="116" rx="14"/>
      <text class="t-title" x="486" y="436">Orchestrator</text>
      <text class="t-sub"   x="486" y="455">event → AgentRun</text>
      <text class="t-sub"   x="486" y="471">session · autonomy ·</text>
      <text class="t-sub"   x="486" y="487">tool profile · model</text>
      <rect x="486" y="496" width="78" height="16" rx="8" fill="#eef2fb"/>
      <text class="t-tag badge" x="494" y="507.5" fill="#3556a8">max 2 concurrent</text>
    </g>
    <text class="t-path" x="486" y="538">core/orchestrator.py</text>

    <!-- ================= AGENT LOOP ================= -->
    <g class="card">
      <rect class="surface" x="720" y="356" width="386" height="214" rx="16"/>
      <text class="t-title" x="740" y="386">Agent loop</text>
      <text class="t-sub"   x="740" y="404">async · streaming · provider ⇄ tools ⇄ policy</text>

      <!-- provider chip -->
      <rect x="740" y="420" width="112" height="58" rx="11" fill="#fff" stroke="var(--line)"/>
      <rect x="740" y="420" width="112" height="4" rx="2" fill="var(--models)"/>
      <text class="t-chip" x="752" y="444">Provider</text>
      <text class="t-sub"  x="752" y="461">stream + cache</text>

      <!-- tools dispatch chip -->
      <rect x="868" y="420" width="112" height="58" rx="11" fill="#fff" stroke="var(--line)"/>
      <rect x="868" y="420" width="112" height="4" rx="2" fill="var(--tools)"/>
      <text class="t-chip" x="880" y="444">Tool dispatch</text>
      <text class="t-sub"  x="880" y="461">core/registry.py</text>

      <!-- policy chip -->
      <rect x="740" y="492" width="240" height="60" rx="11" fill="#fbfdff" stroke="#dbe6f7"/>
      <text class="t-chip" x="752" y="514">PolicyEngine · safety tiers</text>
      <text class="t-sub"  x="752" y="531">READ_ONLY · MUTATING_LOCAL ·</text>
      <text class="t-sub"  x="752" y="546">OUTWARD · DESTRUCTIVE → always prompts</text>
    </g>
    <text class="t-path" x="996" y="386" text-anchor="end">core/agent.py</text>
    <text class="t-path" x="740" y="588">core/policy.py · deferred approvals park on store → Web Push</text>

    <!-- ================= SQLITE STORE ================= -->
    <g class="card">
      <rect class="surface" x="340" y="690" width="766" height="118" rx="16"
            fill="#f3f6fb"/>
      <text class="t-title" x="362" y="722">SQLite store · one durable file (local disk, WAL)</text>
      <text class="t-sub"   x="362" y="744">sessions · runs · audit_log (append-only) · approvals · triggers · watch_state</text>
      <text class="t-sub"   x="362" y="762">memory: facts · episodes · vec0 vectors (sqlite-vec KNN)</text>
      <text class="t-path"  x="362" y="792">store/ · store/migrations/ — hand-written SQL, no ORM</text>
      <!-- memory cell marker -->
      <rect x="958" y="700" width="68" height="44" rx="9" fill="#e7faf9" stroke="#bdeceb"/>
      <text class="t-tag badge" x="992" y="720" fill="#0a8f93" text-anchor="middle">memory</text>
      <text class="t-tag badge" x="992" y="734" fill="#0a8f93" text-anchor="middle">+ vectors</text>
    </g>

    <!-- ================= MODELS ================= -->
    <g class="card">
      <rect class="surface" x="1190" y="150" width="250" height="118" rx="14"/>
      <rect x="1190" y="150" width="5" height="118" rx="2.5" fill="var(--models)"/>
      <text class="t-title" x="1212" y="180">Models</text>
      <text class="t-sub"   x="1212" y="200">Anthropic — orchestration,</text>
      <text class="t-sub"   x="1212" y="216">streaming + prompt caching</text>
      <text class="t-sub"   x="1212" y="238">Ollama (local) — classify,</text>
      <text class="t-sub"   x="1212" y="254">embed, triage · qwen3:4b</text>
    </g>
    <text class="t-path" x="1432" y="180" text-anchor="end">providers/</text>

    <!-- ================= TOOLS ================= -->
    <g class="card">
      <rect class="surface" x="1190" y="330" width="250" height="306" rx="14"/>
      <rect x="1190" y="330" width="5" height="306" rx="2.5" fill="var(--tools)"/>
      <text class="t-title" x="1212" y="360">Tools</text>
      <text class="t-sub"   x="1212" y="380">In-process (Tool ABC):</text>
      <text class="t-sub"   x="1212" y="397">files · bash · sandbox ·</text>
      <text class="t-sub"   x="1212" y="414">browser_delegate ·</text>
      <text class="t-sub"   x="1212" y="431">memory · run_stats</text>
      <line x1="1212" y1="446" x2="1418" y2="446" stroke="var(--line)"/>
      <text class="t-sub"   x="1212" y="466">MCP integrations:</text>
      <rect x="1212" y="476" width="206" height="40" rx="9" fill="#eef6ee" stroke="#cfe6cf"/>
      <text class="t-chip" x="1224" y="494" fill="#1f6b3a">Google Workspace</text>
      <text class="t-sub"  x="1224" y="509">Gmail · Calendar · Drive · Tasks</text>
      <rect x="1212" y="524" width="206" height="30" rx="9" fill="#f4f5f7" stroke="#e0e3e9"/>
      <text class="t-chip" x="1224" y="543" fill="#8a93a3">Microsoft 365 — disabled</text>
      <text class="t-sub"  x="1212" y="576">ActionClass per tool gates safety;</text>
      <text class="t-sub"  x="1212" y="592">unlisted MCP tool ⇒ OUTWARD.</text>
      <text class="t-sub"  x="1212" y="608">gmail_send is OUTWARD —</text>
      <text class="t-sub"  x="1212" y="624">never auto-fires, always prompts.</text>
    </g>
    <text class="t-path" x="1432" y="360" text-anchor="end">tools/ · mcp/</text>

    <!-- labels for return flows -->
    <text class="t-tag" x="540" y="206" fill="var(--push)">completion · Web Push</text>
    <text class="t-tag" x="1000" y="640" fill="var(--mem)" text-anchor="middle">recall ⇄ extract</text>

    <!-- ================= ANIMATED PACKETS ================= -->
    <!-- source → bus → shared spine (the heart of the diagram) -->
    <g filter="url(#glow)">
      <circle r="6.5" fill="var(--chat)">
        <animateMotion dur="7s" begin="0s"   repeatCount="indefinite" calcMode="linear">
          <mpath xlink:href="#jCLI"/></animateMotion></circle>
      <circle r="6.5" fill="var(--chat)">
        <animateMotion dur="7s" begin="3.4s" repeatCount="indefinite" calcMode="linear">
          <mpath xlink:href="#jWeb"/></animateMotion></circle>
      <circle r="6.5" fill="var(--cron)">
        <animateMotion dur="7.4s" begin="1.7s" repeatCount="indefinite" calcMode="linear">
          <mpath xlink:href="#jCron"/></animateMotion></circle>
      <circle r="6.5" fill="var(--watch)">
        <animateMotion dur="8s" begin="5s"   repeatCount="indefinite" calcMode="linear">
          <mpath xlink:href="#jWatch"/></animateMotion></circle>
      <!-- second wave for density -->
      <circle r="5" fill="var(--chat)" opacity=".85">
        <animateMotion dur="7s" begin="5.2s" repeatCount="indefinite" calcMode="linear">
          <mpath xlink:href="#jCLI"/></animateMotion></circle>
      <circle r="5" fill="var(--watch)" opacity=".85">
        <animateMotion dur="8s" begin="2.4s" repeatCount="indefinite" calcMode="linear">
          <mpath xlink:href="#jWatch"/></animateMotion></circle>
    </g>

    <!-- provider round-trip (there and back) -->
    <g filter="url(#glow)">
      <circle r="5" fill="var(--models)">
        <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"
          keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
          <mpath xlink:href="#pModels"/></animateMotion></circle>
    </g>
    <!-- tool dispatch round-trip -->
    <g filter="url(#glow)">
      <circle r="5" fill="var(--tools)">
        <animateMotion dur="2s" begin="1s" repeatCount="indefinite"
          keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
          <mpath xlink:href="#pTools"/></animateMotion></circle>
    </g>
    <!-- completion / approval push back to Web UI -->
    <g filter="url(#glow)">
      <circle r="5.5" fill="var(--push)">
        <animateMotion dur="3.4s" begin="2.2s" repeatCount="indefinite" calcMode="linear">
          <mpath xlink:href="#pPush"/></animateMotion></circle>
    </g>
    <!-- memory recall/extract -->
    <g filter="url(#glow)">
      <circle r="4.5" fill="var(--mem)">
        <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite"
          keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
          <mpath xlink:href="#pMem"/></animateMotion></circle>
    </g>

    <!-- ================= LEGEND ================= -->
    <g class="legend" transform="translate(44,856)">
      <circle cx="6"   cy="-4" r="6" fill="var(--chat)"/><text x="18" y="0">Chat (CLI / Web)</text>
      <circle cx="172" cy="-4" r="6" fill="var(--cron)"/><text x="184" y="0">Cron tick</text>
      <circle cx="300" cy="-4" r="6" fill="var(--watch)"/><text x="312" y="0">Watch hit (email)</text>
      <circle cx="470" cy="-4" r="6" fill="var(--push)"/><text x="482" y="0">Completion / approval push</text>
      <circle cx="710" cy="-4" r="6" fill="var(--mem)"/><text x="722" y="0">Memory recall ⇄ extract</text>
      <circle cx="918" cy="-4" r="6" fill="var(--models)"/><text x="930" y="0">Model round-trip</text>
    </g>
  </svg>
  </div>
</div>
</body>
</html>
