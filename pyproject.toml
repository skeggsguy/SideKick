[project]
name = "harness"
version = "0.1.0"
description = "A personal agent harness: local + cloud LLMs, code execution, and Google Workspace integration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "aiosqlite>=0.22.1",
    "mcp>=1.27.2",
    "google-api-python-client>=2.197.0",
    "google-auth-oauthlib>=1.4.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "croniter>=6.2.2",
    "pywebpush>=2.3.0",
    "sqlite-vec>=0.1.9",
    "msal>=1.37.0",
    "faster-whisper>=1.2.1",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "trafilatura>=2.1.0",
    "websockets>=16.1",
    "jsonschema>=4.26.0",
    "apple-fm-sdk>=0.2.1",
    "feedparser>=6.0.14",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# GPU dictation on the old WSL/NVIDIA box only (gateway/stt.py preloads these
# on the cuda path). No macOS/arm64 wheels exist: `uv sync --extra cuda` on Linux.
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
harness = "harness.main:main"
agentd = "harness.gateway.agentd:main"
egress-proxy = "harness.egress_proxy:main"
google-workspace-mcp = "mcp_servers.google_workspace.server:main"
ms365-mcp = "mcp_servers.ms365.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness", "mcp_servers"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default runs are offline: the live tier is opt-in via `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: calls the real Anthropic API; run manually before releases",
    "docker: needs a working Docker daemon + built image/network; self-skips when absent",
]
